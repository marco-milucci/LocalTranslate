name: Build Portable Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        shell: pwsh
        run: |
          if (Test-Path "LocalTranslate.zip") {
              Write-Host "Estrazione di LocalTranslate.zip in corso..."
              Expand-Archive -Path "LocalTranslate.zip" -DestinationPath "." -Force
              if (Test-Path "LocalTranslate\backend") {
                  Copy-Item -Recurse -Force "LocalTranslate\*" "."
              }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download & Convert Model
        shell: pwsh
        run: |
          python -m backend.scripts.download_and_convert

      - name: Build Executable Package
        shell: pwsh
        run: |
          powershell.exe -ExecutionPolicy Bypass -File .\windows\build.ps1 -Clean -IncludeModel
          if (Test-Path "dist\LocalTranslate-Portable\_internal\backend") {
              Copy-Item -Recurse -Force "backend\models" "dist\LocalTranslate-Portable\_internal\backend\models"
              Compress-Archive -Path "dist\LocalTranslate-Portable\*" -DestinationPath "dist\LocalTranslate-Portable-Windows.zip" -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranslate-Portable-Windows
          path: dist/LocalTranslate-Portable-Windows.zip
          retention-days: 30
