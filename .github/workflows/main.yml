name: Build Portable Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download & Convert NLLB-200 INT8 Model
        run: |
          python -m backend.scripts.download_and_convert

      - name: Build Standalone Portable Windows Package
        run: |
          powershell.exe -ExecutionPolicy Bypass -File .\windows\build.ps1 -Clean -IncludeModel

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranslate-Portable-Windows
          path: dist/LocalTranslate-Portable-Windows.zip
