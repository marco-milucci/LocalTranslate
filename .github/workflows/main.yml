name: Build Portable Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        shell: pwsh
        run: |
          if (Test-Path "LocalTranslate.zip") {
              Write-Host "Estrazione di LocalTranslate.zip in corso..."
              Expand-Archive -Path "LocalTranslate.zip" -DestinationPath "." -Force
              if (Test-Path "LocalTranslate\backend") {
                  Copy-Item -Recurse -Force "LocalTranslate\*" "."
              }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download & Convert Model
        shell: pwsh
        run: |
          python -m backend.scripts.download_and_convert

      - name: Build Standalone Executable
        shell: python
        run: |
          import os
          import sys
          import shutil
          import pathlib
          import zipfile
          import PyInstaller.__main__

          print("=== Inizio compilazione PyInstaller ===")
          root_dir = pathlib.Path(".").resolve()
          backend_dir = root_dir / "backend"
          dist_dir = root_dir / "dist"
          build_dir = root_dir / "build"
          portable_dir = dist_dir / "LocalTranslate-Portable"

          icon_path = root_dir / "assets" / "LocalTranslate.ico"
          icon_args = [f"--icon={icon_path}"] if icon_path.exists() else []

          pyinstaller_args = [
              "--name=LocalTranslate",
              "--onedir",
              "--noconsole",
              *icon_args,
              "--collect-all=ctranslate2",
              "--collect-all=transformers",
              "--collect-all=sentencepiece",
              "--collect-all=pystray",
              "--collect-all=tkinter",
              "--collect-all=_tkinter",
              "--copy-metadata=ctranslate2",
              "--copy-metadata=transformers",
              "--copy-metadata=sentencepiece",
              "--hidden-import=uvicorn.logging",
              "--hidden-import=uvicorn.loops",
              "--hidden-import=uvicorn.loops.auto",
              "--hidden-import=uvicorn.protocols",
              "--hidden-import=uvicorn.protocols.http",
              "--hidden-import=uvicorn.protocols.http.auto",
              "--hidden-import=uvicorn.protocols.websockets",
              "--hidden-import=uvicorn.protocols.websockets.auto",
              "--hidden-import=uvicorn.lifespans",
              "--hidden-import=uvicorn.lifespans.on",
              "--hidden-import=pystray._win32",
              "--hidden-import=PIL",
              "--hidden-import=PIL.Image",
              "--hidden-import=tkinter",
              "--hidden-import=tkinter.ttk",
              "--exclude-module=torch",
              "--exclude-module=torchvision",
              "--exclude-module=torchaudio",
              "--exclude-module=matplotlib",
              "--exclude-module=scipy",
              f"--paths={root_dir}",
              f"--paths={backend_dir}",
              f"--distpath={dist_dir}",
              f"--workpath={build_dir}",
              str(backend_dir / "app" / "desktop" / "app_launcher.py"),
          ]

          print("Esecuzione PyInstaller...")
          PyInstaller.__main__.run(pyinstaller_args)

          output_exe_dir = dist_dir / "LocalTranslate"
          if not output_exe_dir.exists():
              raise RuntimeError(f"Cartella di output PyInstaller non trovata: {output_exe_dir}")

          print("=== Assemblaggio cartella portabile ===")
          if portable_dir.exists():
              shutil.rmtree(portable_dir)
          portable_dir.mkdir(parents=True, exist_ok=True)

          # 1. Copia i binari compilati
          for item in output_exe_dir.iterdir():
              dest = portable_dir / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)

          # 2. Copia estensione browser
          ext_src = root_dir / "extension"
          if ext_src.exists():
              shutil.copytree(ext_src, portable_dir / "extension", dirs_exist_ok=True)

          # 3. Copia assets e istruzioni
          assets_src = root_dir / "assets"
          if assets_src.exists():
              shutil.copytree(assets_src, portable_dir / "assets", dirs_exist_ok=True)
          inst_src = root_dir / "ISTRUZIONI.txt"
          if inst_src.exists():
              shutil.copy2(inst_src, portable_dir / "ISTRUZIONI.txt")

          # 4. Copia modello int8 convertito ovunque si trovi
          models_candidates = [
              root_dir / "models",
              backend_dir / "models",
          ]
          found_model_dir = None
          for cand in models_candidates:
              if (cand / "nllb-200-distilled-600M-int8" / "model.bin").exists() or (cand / "model.bin").exists():
                  found_model_dir = cand
                  break

          if not found_model_dir:
              try:
                  for p in root_dir.glob("**/model.bin"):
                      if p.parent.name == "nllb-200-distilled-600M-int8":
                          found_model_dir = p.parent.parent
                      else:
                          found_model_dir = p.parent
                      break
              except Exception:
                  pass

          if found_model_dir and found_model_dir.exists():
              print(f"Integrazione modello INT8 da {found_model_dir} nel pacchetto portabile...")
              shutil.copytree(found_model_dir, portable_dir / "models", dirs_exist_ok=True)
              shutil.copytree(found_model_dir, portable_dir / "backend" / "models", dirs_exist_ok=True)
          else:
              print("ATTENZIONE: Modello non trovato durante la copia finale!")

          # 5. Raccogli e includi tutte le DLL di runtime C/C++ e Python per Windows
          print("Inclusione DLL di sistema e runtime C++...")
          py_base = pathlib.Path(sys.base_prefix)
          sys32 = pathlib.Path("C:/Windows/System32")
          critical_dlls = [
              "python311.dll",
              "vcruntime140.dll",
              "vcruntime140_1.dll",
              "msvcp140.dll",
              "msvcp140_1.dll",
              "msvcp140_2.dll",
              "msvcp140_codecvt_ids.dll",
              "vcomp140.dll",
          ]
          for dll in critical_dlls:
              src = None
              if (py_base / dll).exists():
                  src = py_base / dll
              elif (sys32 / dll).exists():
                  src = sys32 / dll
              if src:
                  print(f"Copia {dll} da {src}...")
                  shutil.copy2(src, portable_dir / dll)
                  internal_dir = portable_dir / "_internal"
                  if internal_dir.exists():
                      shutil.copy2(src, internal_dir / dll)

          # 6. Crea script batch di avvio con percorso modello esplicito
          bat_file = portable_dir / "AVVIA-LOCALTRANSLATE.bat"
          with open(bat_file, "w", encoding="utf-8") as f:
              f.write("@echo off\n")
              f.write("cd /d \"%~dp0\"\n")
              f.write("set LOCALTRANSLATE_MODEL_PATH=%~dp0models\\nllb-200-distilled-600M-int8\n")
              f.write("set LOCALTRANSLATE_DEVICE=cpu\n")
              f.write("start \"\" \"%~dp0LocalTranslate.exe\"\n")

          # 7. Comprimi la cartella in archivio ZIP autonomo
          print("Compressione archivio ZIP finale...")
          zip_output = dist_dir / "LocalTranslate-Portable-Windows.zip"
          with zipfile.ZipFile(zip_output, "w", zipfile.ZIP_DEFLATED) as zf:
              for root_p, dirs, files in os.walk(portable_dir):
                  for f in files:
                      full_f = pathlib.Path(root_p) / f
                      rel_f = full_f.relative_to(portable_dir)
                      zf.write(full_f, rel_f)
          print(f"Archivio ZIP creato: {zip_output} ({zip_output.stat().st_size} bytes)")
          print("Assemblaggio cartella portabile completato con successo!")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "LocalTranslate v1.0.0 - Windows Portable (Offline 100%)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 LocalTranslate Portable per Windows 10 e Windows 11
            
            Traduttore neurale portabile **100% offline**, zero cloud, con interfaccia grafica e scorciatoia globale `Ctrl + Alt + T`.
            
            ### 📥 Come iniziare:
            1. Scarica il file **`LocalTranslate-Portable-Windows.zip`** qui sotto.
            2. Estrailo in una cartella sul tuo PC (o su una chiavetta USB).
            3. Fai doppio clic su **`LocalTranslate.exe`** (oppure su `AVVIA-LOCALTRANSLATE.bat`).
            
            ### ✨ Caratteristiche:
            - **Nessuna installazione** e nessun diritto di amministratore.
            - **CPU INT8 ultra-veloce**: traduzione in ~50 millisecondi per frase.
            - **Modello NLLB-200 600M INT8 già incorporato** all'interno dello ZIP.
            - **Scorciatoia globale `Ctrl + Alt + T`** per tradurre qualsiasi testo selezionato in qualsiasi programma.
          files: dist/LocalTranslate-Portable-Windows.zip
          retention-days: 30
