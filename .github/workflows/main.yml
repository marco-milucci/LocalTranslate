name: Build Portable Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        shell: pwsh
        run: |
          if (Test-Path "LocalTranslate.zip") {
              Write-Host "Estrazione di LocalTranslate.zip in corso..."
              Expand-Archive -Path "LocalTranslate.zip" -DestinationPath "." -Force
              if (Test-Path "LocalTranslate\backend") {
                  Copy-Item -Recurse -Force "LocalTranslate\*" "."
              }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download & Convert Model
        shell: pwsh
        run: |
          python -m backend.scripts.download_and_convert

      - name: Build Executable Package
        shell: pwsh
        run: |
          Write-Host "Compilazione nativa con PyInstaller..."
          cd backend
          python -m PyInstaller localtranslate.spec --distpath "..\dist" --workpath "..\build"
          cd ..

          Write-Host "Assemblaggio pacchetto portabile..."
          $PortableDir = "dist\LocalTranslate-Portable"
          if (Test-Path $PortableDir) { Remove-Item -Recurse -Force $PortableDir }
          New-Item -ItemType Directory -Path $PortableDir | Out-Null

          Copy-Item -Recurse -Force "dist\LocalTranslate\*" $PortableDir
          Copy-Item -Recurse -Force "extension" "$PortableDir\extension"
          if (Test-Path "assets") {
              Copy-Item -Recurse -Force "assets" "$PortableDir\assets"
          }
          if (Test-Path "backend\models") {
              Copy-Item -Recurse -Force "backend\models" "$PortableDir\backend\models"
              Copy-Item -Recurse -Force "backend\models" "$PortableDir\models"
              if (Test-Path "$PortableDir\_internal\backend") {
                  Copy-Item -Recurse -Force "backend\models" "$PortableDir\_internal\backend\models"
              }
          }

          Write-Host "Creazione archivio ZIP finale..."
          $ZipOutput = "dist\LocalTranslate-Portable-Windows.zip"
          if (Test-Path $ZipOutput) { Remove-Item -Force $ZipOutput }
          Compress-Archive -Path "$PortableDir\*" -DestinationPath $ZipOutput -CompressionLevel Optimal
          Write-Host "Pacchetto creato con successo: $ZipOutput"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranslate-Portable-Windows
          path: dist/LocalTranslate-Portable-Windows.zip
          retention-days: 30
